spring:
  application:
    name: ticket

  datasource:
    url: jdbc:mysql://127.0.0.1:13306/ticket?connectionTimeZone=UTC&characterEncoding=UTF-8

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  data:
    redis:
      host: 127.0.0.1
      port: 16379

  docker:
    compose:
      start:
        skip: never

ticket:
  payment:
    toss:
      secret-key: ${TOSS_SECRET_KEY:}
      base-url: https://api.tosspayments.com
      connect-timeout: 3s
      read-timeout: 60s
    recovery:
      delay: 70s
      batch-size: 20
      scheduler-interval: 10s

  reservation:
    expiry:
      batch-size: 100
      scheduler-interval: 1s

  queue:
    admission:
      per-schedule-capacity: 100
      global-capacity: 500
      max-per-run: 100
      candidate-scan-limit: 1000
      scheduler-interval: 1s
      waiting-activity-window: 5m
      initial-lease: 5m
      hard-cap: 30m
      execution-lease: 900ms
